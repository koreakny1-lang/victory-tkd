*{box-sizing:border-box}
body{
  margin:0;
  font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;
  background:#f4f6f8;
  color:#172033
}
button,input,textarea{font:inherit}
.hidden{display:none!important}

/* 로그인 */
#login{
  min-height:100vh;
  background:#07192d;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.login-box{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:12px;
  padding:34px
}
.login-box h2{margin:0 0 8px}
.login-box p{color:#7b8794;font-size:13px}
.login-box input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #dde3e9;
  border-radius:6px
}
.login-box button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:6px;
  background:#ffd000;
  font-weight:900;
  cursor:pointer
}

/* 관리자 */
header{
  height:64px;
  background:#07192d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:50
}
header span{color:#ffd000}
header button{
  border:1px solid rgba(255,255,255,.25);
  background:transparent;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer
}

.layout{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:calc(100vh - 64px)
}
aside{
  background:#fff;
  border-right:1px solid #e5e8ec;
  padding:16px;
  position:sticky;
  top:64px;
  height:calc(100vh - 64px);
  overflow:auto
}
aside button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
  margin-bottom:3px
}
aside button:hover,
aside button.active{
  background:#07192d;
  color:#fff
}

main{
  padding:24px;
  max-width:1250px;
  width:100%
}
.notice{
  background:#fff7cf;
  border:1px solid #f0d96b;
  padding:13px 15px;
  border-radius:8px;
  margin-bottom:18px;
  line-height:1.6;
  font-size:14px
}
.page{display:none}
.page.active{display:block}
.page h2{margin:0 0 18px}

.panel{
  background:#fff;
  border:1px solid #e5e8ec;
  border-radius:10px;
  padding:20px;
  margin-bottom:15px
}
.panel h3{margin-top:0}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:13px 0 6px
}
input[type=text],
input[type=email],
input[type=password],
input[type=url],
textarea{
  width:100%;
  border:1px solid #d9dfe6;
  border-radius:6px;
  padding:11px 12px;
  background:#fff
}
textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.6
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.photo-box{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:18px;
  align-items:start
}
.preview{
  width:180px;
  height:130px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #dfe4ea;
  background:#f1f3f5
}
.photo-actions input{max-width:100%}
.upload-btn{
  border:0;
  background:#07192d;
  color:#fff;
  font-weight:800;
  padding:10px 14px;
  border-radius:6px;
  margin-top:8px;
  cursor:pointer
}
.delete-btn{
  border:1px solid #e0e4e8;
  background:#fff;
  padding:9px 12px;
  border-radius:6px;
  cursor:pointer;
  margin-left:5px
}
.savebar{
  position:sticky;
  bottom:0;
  background:rgba(244,246,248,.95);
  padding:12px 0;
  z-index:30
}
.save{
  width:100%;
  border:0;
  border-radius:8px;
  background:#ffd000;
  padding:15px;
  font-weight:900;
  cursor:pointer
}
.status{
  font-size:13px;
  color:#65717e;
  margin-top:7px
}
.small{
  font-size:12px;
  color:#7b8794;
  line-height:1.5
}
hr{
  border:0;
  border-top:1px solid #edf0f2;
  margin:20px 0
}

@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  aside{
    position:static;
    height:auto;
    display:flex;
    overflow:auto;
    gap:5px
  }
  aside button{
    min-width:max-content
  }
  .grid2,.grid3{grid-template-columns:1fr}
  .photo-box{grid-template-columns:1fr}
}

</main>

/* =========================================================
   화면 만들기
========================================================= */

function inputHTML(field){

 const [id,label,value,type] = field;

 if(type === 'area'){
  return `
   <label>${label}</label>
   <textarea
     id="${id}"
     data-save="1"
     data-default="${escapeAttr(value)}"
   >${escapeHTML(value)}</textarea>
  `;
 }

 const isUrl =
   id.endsWith('_url');

 return `
  <label>${label}</label>
  <input
    id="${id}"
    data-save="1"
    data-default="${escapeAttr(value)}"
    type="${isUrl ? 'url' : 'text'}"
    value="${escapeAttr(value)}"
  >
 `;
}


function photoHTML(photo){

 const [key,label] = photo;

 return `
  <div class="panel">
   <h3>${label}</h3>

   <div class="photo-box">

    <img
      id="preview_${key}"
      class="preview"
      alt="${label}"
    >

    <div class="photo-actions">

     <input
       id="file_${key}"
       type="file"
       accept="image/*"
       onchange="previewLocal('${key}',this)"
     >

     <br>

     <button
       class="upload-btn"
       onclick="uploadPhoto('${key}')"
     >
       사진 업로드
     </button>

     <button
       class="delete-btn"
       onclick="removePhoto('${key}')"
     >
       사진 삭제
     </button>

     <div
       id="photoStatus_${key}"
       class="status"
     ></div>

     <div class="small">
      JPG, PNG, WEBP 등의 사진을 선택할 수 있습니다.
     </div>

    </div>
   </div>
  </div>
 `;
}


function buildAdmin(){

 const menu =
  document.getElementById('menu');

 const pages =
  document.getElementById('pages');

 menu.innerHTML = '';
 pages.innerHTML = '';

 sections.forEach((section,index)=>{

  const btn =
   document.createElement('button');

  btn.innerHTML =
   `${section.icon} ${section.name}`;

  btn.dataset.page =
   section.id;

  btn.onclick =
   ()=>showPage(section.id);

  if(index===0)
   btn.classList.add('active');

  menu.appendChild(btn);


  const page =
   document.createElement('section');

  page.id =
   `page_${section.id}`;

  page.className =
   `page ${index===0?'active':''}`;

  let html =
   `<h2>${section.icon} ${section.name}</h2>`;


  if(section.fields){

   html += `<div class="panel">`;

   section.fields.forEach(f=>{
    html += inputHTML(f);
   });

   html += `</div>`;
  }


  if(section.photos){

   section.photos.forEach(p=>{
    html += photoHTML(p);
   });
  }


  if(section.repeat){

   section.repeat.forEach(item=>{

    html += `
     <div class="panel">
      <h3>${item.title}</h3>
    `;

    item.fields.forEach(f=>{
     html += inputHTML(f);
    });

    html += `</div>`;

    html +=
     photoHTML(item.photo);

   });
  }

  page.innerHTML = html;

  pages.appendChild(page);

 });

}


function showPage(id){

 document
  .querySelectorAll('.page')
  .forEach(el=>
   el.classList.remove('active')
  );

 document
  .querySelectorAll('#menu button')
  .forEach(el=>
   el.classList.remove('active')
  );

 document
  .getElementById(`page_${id}`)
  .classList.add('active');

 const button =
  document.querySelector(
   `#menu button[data-page="${id}"]`
  );

 if(button)
  button.classList.add('active');

 window.scrollTo({
  top:0,
  behavior:'smooth'
 });

}

async function login(){

 const email =
  document
   .getElementById('email')
   .value
   .trim();

 const password =
  document
   .getElementById('password')
   .value;

 const msg =
  document.getElementById('loginMsg');

 msg.textContent =
  '로그인 중...';

 const {data,error} =
  await db.auth.signInWithPassword({
   email,
   password
  });

 if(error){

  msg.textContent =
   '로그인 실패: ' + error.message;

  return;
 }

 msg.textContent = '';

 await enterAdmin();
}


async function logout(){

 await db.auth.signOut();

 document
  .getElementById('admin')
  .classList.add('hidden');

 document
  .getElementById('login')
  .classList.remove('hidden');

}


async function enterAdmin(){

 document
  .getElementById('login')
  .classList.add('hidden');

 document
  .getElementById('admin')
  .classList.remove('hidden');

 buildAdmin();

 await loadSavedData();
}


/* =========================================================
   저장된 데이터 불러오기
========================================================= */

async function loadSavedData(){

 const status =
  document.getElementById('saveStatus');

 status.textContent =
  '저장된 내용을 불러오는 중...';

 const {data,error} =
  await db
   .from('site_content')
   .select('*');

 if(error){

  status.textContent =
   '불러오기 실패: ' + error.message;

  return;
 }

 const latest = {};

 (data || []).forEach(row=>{

  const key =
   row.content_key;

  if(
   !latest[key] ||
   new Date(row.updated_at || 0) >
   new Date(latest[key].updated_at || 0)
  ){
   latest[key] = row;
  }

 });


 /* 글 */
 document
  .querySelectorAll('[data-save="1"]')
  .forEach(el=>{

   const row =
    latest[el.id];

   if(
    row &&
    row.content_value !== null &&
    row.content_value !== undefined
   ){
    el.value =
     row.content_value;
   }

  });


 /* 사진 */
 const photoKeys =
  getPhotoKeys();

 photoKeys.forEach(key=>{

  let row =
   latest[key];

  /* 예전 메인사진 호환 */
  if(
   key === 'hero_photo' &&
   !row &&
   latest['main_photo']
  ){
   row =
    latest['main_photo'];
  }

  if(
   row &&
   row.content_value
  ){

   const img =
    document.getElementById(
     `preview_${key}`
    );

   if(img){
    img.src =
     row.content_value;
   }

  }

 });

 status.textContent =
  '저장된 내용을 불러왔습니다.';
}


/* =========================================================
   글 전체 저장
========================================================= */

async function saveAll(){

 const status =
  document.getElementById('saveStatus');

 const elements =
  [
   ...document.querySelectorAll(
    '[data-save="1"]'
   )
  ];

 status.textContent =
  '저장 중...';

 const rows =
  elements.map(el=>({
   section:'content',
   content_key:el.id,
   content_value:el.value,
   updated_at:
    new Date().toISOString()
  }));

 const {error} =
  await db
   .from('site_content')
   .upsert(
    rows,
    {
     onConflict:
      'section,content_key'
    }
   );

 if(error){

  status.textContent =
   '저장 실패: ' +
   error.message;

  return;
 }

 status.textContent =
  '저장 완료! 홈페이지에 반영할 준비가 되었습니다.';
}


/* =========================================================
   사진 업로드
========================================================= */

function previewLocal(key,input){

 const file =
  input.files &&
  input.files[0];

 if(!file)
  return;

 const img =
  document.getElementById(
   `preview_${key}`
  );

 img.src =
  URL.createObjectURL(file);
}


async function uploadPhoto(key){

 const input =
  document.getElementById(
   `file_${key}`
  );

 const status =
  document.getElementById(
   `photoStatus_${key}`
  );

 const file =
  input.files &&
  input.files[0];

 if(!file){

  status.textContent =
   '먼저 사진을 선택해주세요.';

  return;
 }

 if(file.size >
    15 * 1024 * 1024){

  status.textContent =
   '사진은 15MB 이하로 선택해주세요.';

  return;
 }

 status.textContent =
  '사진 업로드 중...';


 const ext =
  (
   file.name.split('.').pop() ||
   'jpg'
  )
  .toLowerCase()
  .replace(/[^a-z0-9]/g,'');


 const path =
  `website/${key}_${Date.now()}.${ext}`;


 const upload =
  await db.storage
   .from('site-images')
   .upload(
    path,
    file,
    {
     cacheControl:'3600',
     upsert:false
    }
   );


 if(upload.error){

  status.textContent =
   '업로드 실패: ' +
   upload.error.message;

  return;
 }


 const publicResult =
  db.storage
   .from('site-images')
   .getPublicUrl(path);


 const publicUrl =
  publicResult
   .data
   .publicUrl;


 const {error} =
  await db
   .from('site_content')
   .upsert(
    {
     section:'images',
     content_key:key,
     content_value:publicUrl,
     updated_at:
      new Date().toISOString()
    },
    {
     onConflict:
      'section,content_key'
    }
   );


 if(error){

  status.textContent =
   '사진 주소 저장 실패: ' +
   error.message;

  return;
 }


 /* 예전 홈페이지와 호환 */
 if(key === 'hero_photo'){

  await db
   .from('site_content')
   .upsert(
    {
     section:'images',
     content_key:'main_photo',
     content_value:publicUrl,
     updated_at:
      new Date().toISOString()
    },
    {
     onConflict:
      'section,content_key'
    }
   );

 }


 const img =
  document.getElementById(
   `preview_${key}`
  );

 img.src =
  publicUrl;

 status.textContent =
  '사진 업로드 완료!';
}


/* =========================================================
   사진 삭제
========================================================= */

async function removePhoto(key){

 if(
  !confirm(
   '홈페이지에서 이 사진을 삭제할까요?'
  )
 ){
  return;
 }

 const status =
  document.getElementById(
   `photoStatus_${key}`
  );

 status.textContent =
  '삭제 중...';


 const {error} =
  await db
   .from('site_content')
   .upsert(
    {
     section:'images',
     content_key:key,
     content_value:'',
     updated_at:
      new Date().toISOString()
    },
    {
     onConflict:
      'section,content_key'
    }
   );


 if(error){

  status.textContent =
   '삭제 실패: ' +
   error.message;

  return;
 }


 if(key === 'hero_photo'){

  await db
   .from('site_content')
   .upsert(
    {
     section:'images',
     content_key:'main_photo',
     content_value:'',
     updated_at:
      new Date().toISOString()
    },
    {
     onConflict:
      'section,content_key'
    }
   );

 }


 const img =
  document.getElementById(
   `preview_${key}`
  );

 img.removeAttribute('src');

 const input =
  document.getElementById(
   `file_${key}`
  );

 input.value = '';

 status.textContent =
  '사진을 삭제했습니다.';
}


/* =========================================================
   사진 키 목록
========================================================= */

function getPhotoKeys(){

 const keys = [];

 sections.forEach(section=>{

  if(section.photos){

   section.photos.forEach(p=>
    keys.push(p[0])
   );

  }

  if(section.repeat){

   section.repeat.forEach(item=>{

    if(item.photo)
     keys.push(
      item.photo[0]
     );

   });

  }

 });

 return keys;
}


/* =========================================================
   HTML 안전 처리
========================================================= */

function escapeHTML(value){

 return String(value)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function escapeAttr(value){

 return escapeHTML(value)
  .replace(/\n/g,'&#10;');

}
