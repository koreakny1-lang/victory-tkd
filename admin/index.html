function fieldHTML(key,label,value,type='text'){
 const tag=type==='area'?`<textarea data-key="${key}">${value}</textarea>`:`<input data-key="${key}" value="${value}">`;
 return `<div><label>${label}</label>${tag}</div>`;
}
function photoHTML(key,label){
 return `<div class="panel"><h2>${label}</h2><div id="preview_${key}" class="photo">사진 미리보기</div><input id="file_${key}" type="file" accept="image/*"><button class="upload" onclick="uploadPhoto('${key}',this)">사진 업로드</button></div>`;
}
function render(){
 const menus=document.getElementById('menus'),pages=document.getElementById('pages');
 sections.forEach((s,idx)=>{
  menus.insertAdjacentHTML('beforeend',`<button class="menu ${idx===0?'active':''}" onclick="openPage('${s.id}',this)">${s.icon} ${s.name}</button>`);
  let body='';
  if(s.fields) body+=`<div class="panel grid2">${s.fields.map(f=>fieldHTML(...f)).join('')}</div>`;
  if(s.photos) body+=`<div class="${s.photos.length>1?'grid3':'grid2'}">${s.photos.map(p=>photoHTML(...p)).join('')}</div>`;
  if(s.repeat==='teacher'){
   body='<div class="grid3">'+defaults.teacher.map((d,i)=>{let n=i+1;return `<div class="panel">${photoHTML(`teacher${n}_photo`,`지도진 ${n} 사진`)}${fieldHTML(`teacher${n}_role`,'직책',d[0])}${fieldHTML(`teacher${n}_name`,'표시 이름',d[1])}${fieldHTML(`teacher${n}_desc`,'소개',d[2],'area')}</div>`}).join('')+'</div>';
  }
  if(s.repeat==='philo'){
   body='<div class="grid2">'+defaults.philo.map((d,i)=>{let n=i+1;return `<div class="panel"><h2>교육철학 ${n}</h2>${fieldHTML(`philo${n}_title`,'제목',d[0])}${fieldHTML(`philo${n}_desc`,'설명',d[1],'area')}</div>`}).join('')+'</div>';
  }
  if(s.repeat==='program'){
   body='<div class="grid2">'+defaults.program.map((d,i)=>{let n=i+1;return `<div class="panel">${photoHTML(`program${n}_photo`,`프로그램 ${n} 사진`)}${fieldHTML(`program${n}_title`,'프로그램 이름',d[0])}${fieldHTML(`program${n}_meta`,'작은 설명',d[1])}${fieldHTML(`program${n}_desc`,'설명',d[2],'area')}</div>`}).join('')+'</div>';
  }
  if(s.repeat==='faq'){
   body=defaults.faq.map((d,i)=>{let n=i+1;return `<div class="panel"><h2>FAQ ${n}</h2>${fieldHTML(`faq${n}_q`,'질문',d[0])}${fieldHTML(`faq${n}_a`,'답변',d[1],'area')}</div>`}).join('');
  }
  pages.insertAdjacentHTML('beforeend',`<section id="${s.id}" class="page ${idx===0?'active':''}"><div class="title">${s.name}</div><div class="desc">${s.name} 내용을 수정할 수 있습니다.</div>${body}</section>`);
 });
}
render();

function openPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.menu').forEach(x=>x.classList.remove('active'));btn.classList.add('active');window.scrollTo(0,0)}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('loginMsg').textContent='로그인 중...';const {error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent='로그인 실패: 이메일/비밀번호를 확인해주세요.';return}showAdmin()}
async function logout(){await db.auth.signOut();location.reload()}
async function check(){const {data}=await db.auth.getSession();if(data.session)showAdmin()}
function showAdmin(){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');loadData()}

async function loadData(){
 const status=document.getElementById('status');status.textContent='저장된 내용을 불러오는 중...';
 const {data,error}=await db.from('site_content').select('*');
 if(error){status.textContent='불러오기 오류';console.error(error);return}
 const latest={};(data||[]).forEach(r=>{if(!r.content_key)return;let o=latest[r.content_key];if(!o||new Date(r.updated_at||0)>=new Date(o.updated_at||0))latest[r.content_key]=r});
 document.querySelectorAll('[data-key]').forEach(el=>{const r=latest[el.dataset.key];if(r&&r.content_value!=null)el.value=r.content_value});
 document.querySelectorAll('[id^="preview_"]').forEach(el=>{const key=el.id.replace('preview_',''),r=latest[key];if(r&&r.content_value)setPreview(key,r.content_value)});
 if(!latest.hero_photo&&latest.main_photo?.content_value)setPreview('hero_photo',latest.main_photo.content_value);
 status.textContent='저장된 내용을 불러왔습니다.';
 setTimeout(()=>status.textContent='수정한 뒤 저장해주세요.',1800)
}
async function saveAll(){
 const status=document.getElementById('status'),btn=document.querySelector('.save');btn.disabled=true;status.textContent='저장 중...';
 try{
  for(const el of document.querySelectorAll('[data-key]')){
   const {error}=await db.from('site_content').upsert({section:'content',content_key:el.dataset.key,content_value:el.value,updated_at:new Date().toISOString()},{onConflict:'section,content_key'});
   if(error)throw error;
  }
  status.textContent='✓ 변경사항이 저장되었습니다.';
 }catch(e){console.error(e);status.textContent='저장 오류';alert('저장 실패\\n'+(e.message||''))}finally{btn.disabled=false}
}
async function uploadPhoto(key,btn){
 const input=document.getElementById('file_'+key);if(!input?.files?.length){alert('먼저 사진을 선택해주세요.');return}
 const file=input.files[0];if(file.size>15*1024*1024){alert('15MB 이하 사진을 사용해주세요.');return}
 const old=btn.textContent;btn.disabled=true;btn.textContent='업로드 중...';
 try{
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`website/${key}-${Date.now()}.${ext}`;
  const {error:up}=await db.storage.from('site-images').upload(path,file,{cacheControl:'3600',upsert:false});if(up)throw up;
  const {data:u}=db.storage.from('site-images').getPublicUrl(path),url=u.publicUrl;
  const {error}=await db.from('site_content').upsert({section:'images',content_key:key,content_value:url,updated_at:new Date().toISOString()},{onConflict:'section,content_key'});if(error)throw error;
  if(key==='hero_photo')await db.from('site_content').upsert({section:'images',content_key:'main_photo',content_value:url,updated_at:new Date().toISOString()},{onConflict:'section,content_key'});
  setPreview(key,url);input.value='';alert('사진이 저장되었습니다.');
 }catch(e){console.error(e);alert('사진 업로드 실패\\n'+(e.message||''))}finally{btn.disabled=false;btn.textContent=old}
}
function setPreview(key,url){const p=document.getElementById('preview_'+key);if(p)p.innerHTML=`<img src="${url}" alt="">`}
check();
</script>
</body>
</html>
