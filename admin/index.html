<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>승리태권도 홈페이지 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,"Noto Sans KR",sans-serif;background:#f4f6fa;color:#172033}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:#17256b;color:white;font-weight:700}button:disabled{opacity:.5;cursor:default}button.alt{background:#e7eaf3;color:#17256b}button.danger{background:#a8222c}a{color:#17256b}.hidden{display:none!important}.login{max-width:420px;margin:10vh auto;padding:30px;background:white;border-radius:22px;box-shadow:0 16px 60px #17256b15}h1{font-size:25px;line-height:1.3;margin:0 0 12px}label{display:block;margin:18px 0 6px;font-weight:700}input,textarea{width:100%;border:1px solid #c6cddd;border-radius:10px;padding:12px;background:white}input:focus,textarea:focus{outline:2px solid #17256b;outline-offset:2px}.login button{width:100%;margin-top:22px}.status{min-height:24px;font-size:14px;color:#43516a}.status.error{color:#a8222c}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white;padding:14px 22px;border-bottom:1px solid #dce1ea}.top b{flex:1}.top .status{flex-basis:100%;margin:0}.yellow{background:#ffd400;color:#17256b}.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 116px);min-height:520px}aside{padding:20px;overflow:auto;background:white;border-right:1px solid #dce1ea}aside h2{font-size:20px;margin:0 0 10px}aside p{font-size:14px;color:#5b6474}aside button{margin:6px 4px 0 0}iframe{width:100%;height:100%;border:0;background:white}.photo{width:100%;max-height:180px;object-fit:contain;background:#f0f2f7;border-radius:10px;margin-top:12px}.section-nav{display:flex;flex-wrap:wrap;gap:5px;margin:18px 0}.section-nav button{font-size:14px;padding:6px 9px}#textValue{min-height:180px}.small{font-size:14px;color:#5b6474}.title{font-weight:800;color:#17256b}#photoPanel label{font-size:14px}@media(max-width:760px){.layout{grid-template-columns:1fr;height:auto;display:flex;flex-direction:column}aside{border:0;border-bottom:1px solid #dce1ea;max-height:55vh}.layout iframe{height:70vh}.top{padding:12px}.login{margin:5vh 15px}button{padding:10px 12px}}
</style></head><body>
<section id="login" class="login"><h1>홈페이지 관리</h1><p>기존 관리자 이메일과 비밀번호로 로그인하세요.</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">로그인</button><p id="loginStatus" class="status" role="status"></p></form></section>
<main id="editor" class="hidden"><header class="top"><b>승리태권도 홈페이지 관리</b><button id="save" class="yellow" disabled>변경 내용 저장</button><button id="undo" class="alt">변경 취소</button><a href="../" target="_blank" rel="noopener">홈페이지 보기</a><button id="logout" class="alt">로그아웃</button><p id="status" class="status" role="status" aria-live="polite">홈페이지를 불러오는 중입니다.</p></header>
<div class="layout"><aside><h2>글 · 사진 수정</h2><p>오른쪽 화면에서 글이나 사진을 누르세요. 글은 화면에서 직접 고칠 수도 있습니다.</p><div class="section-nav" id="sections"></div><div id="empty"><p>수정할 글 또는 사진을 선택하세요.</p></div><div id="textPanel" class="hidden"><p class="title">선택한 글</p><label for="textValue">내용</label><textarea id="textValue"></textarea><button id="applyText">글 적용</button><button id="bold" class="alt">굵게</button><p class="small">수정한 뒤 위쪽의 ‘변경 내용 저장’을 눌러 주세요.</p></div><div id="photoPanel" class="hidden"><p class="title" id="photoLabel">선택한 사진</p><img id="photoPreview" class="photo" alt="선택한 사진 미리보기"><label for="photoFile">새 사진 선택</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">사진 업로드</button><label for="photoUrl">또는 사진 주소 입력</label><input id="photoUrl" type="url" placeholder="https://…"><button id="applyUrl" class="alt">사진 주소 적용</button><button id="removePhoto" class="danger">사진 숨기기</button><p class="small">사진을 적용한 뒤 ‘변경 내용 저장’을 눌러 주세요. JPG·PNG·WEBP, 최대 15MB.</p></div></aside><iframe id="preview" title="홈페이지 편집 화면"></iframe></div></main>
<script>'use strict';
window.VICTORY_CONFIG={"url":"https://aquthgfiutnweklyarku.supabase.co","key":"sb_publishable_737beB68jbyhF-VwARkkrA_gyO6PiPz"};
const db=supabase.createClient(VICTORY_CONFIG.url,VICTORY_CONFIG.key);
const $=id=>document.getElementById(id);
let bridge,selectedText,selectedImage,dirty=new Map(),busy=false,frameSelection;
function status(msg,error=false){$('status').textContent=msg;$('status').classList.toggle('error',error)}
function setBusy(value){busy=value;['save','undo','logout','upload','applyText','applyUrl','removePhoto'].forEach(id=>$(id).disabled=value||(id==='save'&&dirty.size===0))}
function changed(section,key,value){dirty.set(section+':'+key,{section,content_key:key,content_value:value});$('save').disabled=busy;status('저장하지 않은 변경 '+dirty.size+'개가 있습니다.')}
function textPlain(el){return el.innerText||''}
function selectText(el){selectedText=el;selectedImage=null;$('empty').classList.add('hidden');$('photoPanel').classList.add('hidden');$('textPanel').classList.remove('hidden');$('textValue').value=textPlain(el)}
function selectImage(item){selectedImage=item;selectedText=null;$('empty').classList.add('hidden');$('textPanel').classList.add('hidden');$('photoPanel').classList.remove('hidden');$('photoLabel').textContent=item.el.alt||'선택한 사진';$('photoFile').value='';const u=item.kind==='img'?item.el.getAttribute('src'):(item.el.style.backgroundImage.match(/url\(["']?([^"')]+)/)||[])[1]||item.orig;$('photoUrl').value=u||'';if(u){$('photoPreview').src=u;$('photoPreview').classList.remove('hidden')}else{$('photoPreview').removeAttribute('src');$('photoPreview').classList.add('hidden')}}
function updateImage(url){bridge.images.filter(it=>it.key===selectedImage.key).forEach(it=>bridge.setImage(it,url));changed('images',selectedImage.key,url);$('photoUrl').value=url;if(url){$('photoPreview').src=url;$('photoPreview').classList.remove('hidden')}else{$('photoPreview').removeAttribute('src');$('photoPreview').classList.add('hidden')}}
async function bindFrame(){
  try{
    const win=$('preview').contentWindow;
    bridge=win.victoryContent;
    if(!bridge)throw Error('홈페이지 연결 코드를 먼저 교체해 주세요.');
    await bridge.ready;
    if(bridge.loadError)throw Error('저장된 내용을 불러오지 못했습니다: '+bridge.loadError);
    const doc=win.document;
    const css=doc.createElement('style');css.textContent='.rv{opacity:1!important;transform:none!important}[data-cms-key]{outline-offset:4px;cursor:text}[data-cms-key]:hover,[data-cms-key]:focus{outline:2px dashed #e53935}[data-cms-image]{cursor:pointer;outline-offset:-4px}[data-cms-image]:hover{outline:3px solid #e53935}.g-row,.ticker-track,.hero-bg{animation-play-state:paused!important}.hero-bg{pointer-events:auto}html{scroll-behavior:auto!important}';doc.head.append(css);
    doc.querySelectorAll('details').forEach(d=>d.open=true);
    bridge.texts.forEach(el=>{el.contentEditable='true';el.setAttribute('spellcheck','false');el.addEventListener('focus',()=>selectText(el));el.addEventListener('input',()=>{const value=bridge.sanitize(el.innerHTML);changed('content',el.dataset.cmsKey,value);if(selectedText===el)$('textValue').value=textPlain(el)});el.addEventListener('paste',e=>{e.preventDefault();doc.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})});
    doc.addEventListener('selectionchange',()=>{const s=win.getSelection();if(s&&s.rangeCount&&selectedText&&selectedText.contains(s.anchorNode))frameSelection=s.getRangeAt(0).cloneRange()});
    doc.addEventListener('click',e=>{const image=e.target.closest('[data-cms-image]');if(image){const item=bridge.images.find(it=>it.el===image);if(item){e.preventDefault();selectImage(item);return}}if(e.target.closest('a,summary,button'))e.preventDefault()},true);
    doc.addEventListener('submit',e=>e.preventDefault(),true);
    const labels=[['.hero','메인'],['.greet','관장 인사말'],['#philosophy','지도진 · 철학'],['#way','유치부'],['#program','프로그램'],['#adult','성인부'],['#space','수련 공간'],['.gallery','수업 사진'],['#reviews','후기'],['#schedule','시간표 · 수련비'],['#faq','FAQ'],['#consult','상담'],['.place','오시는 길'],['footer','하단 안내']];
    $('sections').replaceChildren();labels.forEach(([sel,label])=>{const b=document.createElement('button');b.className='alt';b.textContent=label;b.onclick=()=>doc.querySelector(sel)?.scrollIntoView({block:'start'});$('sections').append(b)});
    const photoPicker=document.createElement('select');photoPicker.style.cssText='width:100%;padding:10px;font:inherit;border-radius:10px;border:1px solid #c6cddd;margin-bottom:15px';photoPicker.setAttribute('aria-label','수정할 사진 선택');const first=document.createElement('option');first.textContent='사진 목록에서 선택';first.value='';photoPicker.append(first);const seen=new Set();bridge.images.forEach(it=>{if(seen.has(it.key))return;seen.add(it.key);const option=document.createElement('option');option.value=it.key;option.textContent=it.kind==='bg'?'메인 배경 사진':(it.el.alt||it.el.closest('.prog')?.querySelector('h4')?.textContent||'수업 사진')+' ('+it.key+')';photoPicker.append(option)});photoPicker.onchange=()=>{const it=bridge.images.find(x=>x.key===photoPicker.value);if(it)selectImage(it)};$('sections').append(photoPicker);
    status('글이나 사진을 눌러 수정하세요. 저장하면 홈페이지에 반영됩니다.');
  }catch(e){status(e.message,true);bridge=null;$('save').disabled=true}
}
function openFrame(){bridge=null;selectedText=selectedImage=null;frameSelection=null;$('empty').classList.remove('hidden');$('textPanel').classList.add('hidden');$('photoPanel').classList.add('hidden');const url=new URL('../',location.href);url.searchParams.set('editor-preview',Date.now());$('preview').src=url.href}
$('preview').addEventListener('load',bindFrame);
async function enter(){const {data,error}=await db.auth.getUser();if(error||!data.user)throw Error('다시 로그인해 주세요.');$('login').classList.add('hidden');$('editor').classList.remove('hidden');openFrame()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginStatus').textContent='로그인 중…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;$('password').value='';await enter();$('loginStatus').textContent=''}catch(err){$('loginStatus').textContent='로그인 실패: '+err.message}finally{$('loginButton').disabled=false}});
$('applyText').onclick=()=>{if(!selectedText||!bridge)return;const parts=$('textValue').value.split('\n');selectedText.replaceChildren();parts.forEach((part,i)=>{if(i)selectedText.append(selectedText.ownerDocument.createElement('br'));selectedText.append(selectedText.ownerDocument.createTextNode(part))});changed('content',selectedText.dataset.cmsKey,selectedText.innerHTML)};
$('bold').onclick=()=>{if(!selectedText||!frameSelection||frameSelection.collapsed){status('오른쪽 화면에서 굵게 할 글자를 선택하세요.',true);return}const win=$('preview').contentWindow;const selection=win.getSelection();selection.removeAllRanges();selection.addRange(frameSelection);win.document.execCommand('bold');changed('content',selectedText.dataset.cmsKey,bridge.sanitize(selectedText.innerHTML))};
$('applyUrl').onclick=()=>{if(!selectedImage||!bridge)return;try{const u=new URL($('photoUrl').value.trim());if(u.protocol!=='https:')throw Error('https://로 시작하는 사진 주소를 입력해 주세요.');updateImage(u.href)}catch(e){status(e.message,true)}};
$('removePhoto').onclick=()=>{if(selectedImage&&bridge&&confirm('이 사진을 홈페이지에서 숨길까요? 저장 후 반영됩니다.'))updateImage('')};
$('upload').onclick=async()=>{
  const item=selectedImage;const file=$('photoFile').files[0];
  if(!item||!bridge||!file){status('사진을 먼저 선택해 주세요.',true);return}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024){status('15MB 이하의 JPG, PNG, WEBP 사진을 선택해 주세요.',true);return}
  setBusy(true);status('사진 업로드 중…');
  try{const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path='website/'+item.key+'_'+crypto.randomUUID()+'.'+ext;const r=await db.storage.from('site-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(r.error)throw r.error;const url=db.storage.from('site-images').getPublicUrl(path).data.publicUrl;bridge.images.filter(it=>it.key===item.key).forEach(it=>bridge.setImage(it,url));changed('images',item.key,url);if(selectedImage===item)selectImage(item);status('사진이 적용되었습니다. ‘변경 내용 저장’을 눌러 주세요.')}catch(e){status('업로드 실패: '+e.message,true)}finally{setBusy(false)}
};
$('save').onclick=async()=>{
  if(!bridge||!dirty.size||busy)return;
  setBusy(true);status('저장 중…');
  try{const {data,error}=await db.auth.getUser();if(error||!data.user)throw Error('로그인이 만료되었습니다. 다시 로그인해 주세요.');const batch=[...dirty.values()].map(r=>({...r,updated_at:new Date().toISOString()}));const result=await db.from('site_content').upsert(batch,{onConflict:'section,content_key'});if(result.error)throw result.error;const verify=await db.from('site_content').select('section,content_key,content_value').in('content_key',batch.map(r=>r.content_key));if(verify.error)throw verify.error;const expected=new Map((verify.data||[]).map(r=>[r.section+':'+r.content_key,r.content_value]));for(const r of batch){if(expected.get(r.section+':'+r.content_key)!==r.content_value)throw Error('저장 결과를 확인하지 못했습니다. 권한을 확인한 후 다시 저장해 주세요.');const id=r.section+':'+r.content_key;if(dirty.get(id)?.content_value===r.content_value)dirty.delete(id)}status(dirty.size?'저장되었습니다. 추가 수정 '+dirty.size+'개는 한 번 더 저장해 주세요.':'저장 완료! 홈페이지를 새로고침하면 수정 내용이 반영됩니다.')}catch(e){status('저장 실패: '+e.message,true)}finally{setBusy(false)}
};
$('undo').onclick=()=>{if(!dirty.size||confirm('저장하지 않은 변경을 취소할까요?')){dirty.clear();$('save').disabled=true;openFrame()}};
$('logout').onclick=async()=>{if(dirty.size&&!confirm('저장하지 않은 변경이 있습니다. 로그아웃할까요?'))return;const r=await db.auth.signOut();if(r.error){status(r.error.message,true);return}dirty.clear();$('editor').classList.add('hidden');$('login').classList.remove('hidden');$('preview').src='about:blank'};
window.addEventListener('beforeunload',e=>{if(dirty.size){e.preventDefault();e.returnValue=''}});
(async()=>{try{const r=await db.auth.getSession();if(r.error)throw r.error;if(r.data.session)await enter()}catch(e){$('loginStatus').textContent=e.message}})();
</script></body></html>
